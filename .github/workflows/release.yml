name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  package-darwin:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="$(scripts/package-release.sh --validate-version "$version")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and package production plugin
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: make package-darwin VERSION="$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cliproxyapi-copilot-darwin-arm64
          path: |
            dist/cliproxyapi-copilot_*_darwin_arm64.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: package-darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="$(scripts/package-release.sh --validate-version "$version")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/src/.cache/home \
            -e GOCACHE=/src/.cache/go-build \
            -e GOMODCACHE=/src/.cache/go-mod \
            -v "$PWD:/src" \
            -w /src \
            golang:1.26-bookworm \
            go test ./...

      - name: Build marketplace package
        run: make package VERSION=${{ steps.version.outputs.value }}

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: cliproxyapi-copilot-darwin-arm64
          path: dist/darwin

      - name: Combine package checksums
        run: |
          cat dist/checksums.txt dist/darwin/checksums.txt > dist/checksums-all.txt
          mv dist/checksums-all.txt dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cliproxyapi-copilot_${{ steps.version.outputs.value }}_linux_amd64.zip \
            dist/darwin/cliproxyapi-copilot_${{ steps.version.outputs.value }}_darwin_arm64.zip \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
